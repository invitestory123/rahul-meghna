</head>
<body>
  <div id="root"></div>

  <!-- Background Music (Ed Sheeran - Perfect) -->
  <audio id="wedding-audio" loop preload="auto" src="editable/assets/perfect.mp3"></audio>

  <!-- Floating Music Toggle Controller -->
  <button id="music-toggle" class="music-toggle-btn" aria-label="Toggle background music" title="Toggle background music">
    <svg class="music-icon-playing" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
    <svg class="music-icon-paused" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
      <line x1="2" y1="2" x2="22" y2="22"></line>
    </svg>
  </button>

  <script>
    (function() {
      function initMusic() {
        const audio = document.getElementById('wedding-audio');
        const toggle = document.getElementById('music-toggle');
        if (!audio || !toggle) return;

        let hasInteracted = false;

        function updateState() {
          if (!audio.paused) {
            toggle.classList.add('playing');
          } else {
            toggle.classList.remove('playing');
          }
        }

        function playMusic() {
          if (!audio) return;
          audio.play().then(() => {
            hasInteracted = true;
            updateState();
          }).catch(function(err) {
            console.log('Autoplay waiting for user gesture:', err);
          });
        }

        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused) {
            playMusic();
          } else {
            audio.pause();
            updateState();
          }
        });

        // Trigger playback upon user interaction with "Open our invitation" button or screen
        function onFirstInteraction() {
          if (!hasInteracted && audio.paused) {
            playMusic();
          }
        }

        document.addEventListener('click', onFirstInteraction, { passive: true });
        document.addEventListener('touchstart', onFirstInteraction, { passive: true });

        audio.addEventListener('play', updateState);
        audio.addEventListener('pause', updateState);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMusic);
      } else {
        initMusic();
      }
    })();
  </script>
</body>
</html>
